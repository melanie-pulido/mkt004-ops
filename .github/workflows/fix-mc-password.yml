name: Fix MC MustChangePassword

on:
  issues:
    types: [labeled]

jobs:
  fix-password:
    if: github.event.label.name == 'fix-mc-password'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run fix
        id: run_script
        run: node -e "
          const { getMcAccessToken, updateUserMustChangePasswordFalse } = require('./scripts/mc-client');
          const body = process.env.ISSUE_BODY || '';
          const match = body.match(/###\s*Username\s*\n+([^\n]+)/);
          if (!match) { console.error('Could not parse Username from issue body'); process.exit(1); }
          const username = match[1].trim();
          (async () => {
            const { accessToken, soapEndpoint } = await getMcAccessToken(
              process.env.MC_CLIENT_ID_ORG1,
              process.env.MC_CLIENT_SECRET_ORG1,
              process.env.MC_SUBDOMAIN_ORG1
            );
            await updateUserMustChangePasswordFalse(soapEndpoint, accessToken, username, 517036101);
            console.log('✅ MustChangePassword=false set for ' + username);
          })().catch(e => { console.error('❌ ' + e.message); process.exit(1); });
        " > /tmp/result.txt 2>&1
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          MC_CLIENT_ID_ORG1: ${{ secrets.MC_CLIENT_ID_ORG1 }}
          MC_CLIENT_SECRET_ORG1: ${{ secrets.MC_CLIENT_SECRET_ORG1 }}
          MC_SUBDOMAIN_ORG1: ${{ secrets.MC_SUBDOMAIN_ORG1 }}

      - name: Post results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = fs.readFileSync('/tmp/result.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: result || '_(no output)_'
            });
            if ('${{ steps.run_script.outcome }}' === 'success') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });
            }

      - name: Fail on error
        if: steps.run_script.outcome == 'failure'
        run: exit 1
