name: Fix MC MustChangePassword

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'MC username (full, e.g. NTO_User_mc-test002@mkt004-1.com)'
        required: true

jobs:
  fix-password:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run fix
        run: node -e "
          const { getMcAccessToken, updateUserMustChangePasswordFalse } = require('./scripts/mc-client');
          (async () => {
            const { accessToken, soapEndpoint } = await getMcAccessToken(
              process.env.MC_CLIENT_ID_ORG1,
              process.env.MC_CLIENT_SECRET_ORG1,
              process.env.MC_SUBDOMAIN_ORG1
            );
            await updateUserMustChangePasswordFalse(soapEndpoint, accessToken, process.env.USERNAME, 517036101);
            console.log('Done: MustChangePassword=false set for ' + process.env.USERNAME);
          })().catch(e => { console.error(e.message); process.exit(1); });
        "
        env:
          USERNAME: ${{ github.event.inputs.username }}
          MC_CLIENT_ID_ORG1: ${{ secrets.MC_CLIENT_ID_ORG1 }}
          MC_CLIENT_SECRET_ORG1: ${{ secrets.MC_CLIENT_SECRET_ORG1 }}
          MC_SUBDOMAIN_ORG1: ${{ secrets.MC_SUBDOMAIN_ORG1 }}
