name: Reset CRM Passwords
description: Reset CRM user passwords back to journey@123 for stuck users
labels: ["reset-crm-passwords"]
body:
  - type: dropdown
    id: org
    attributes:
      label: Org
      description: Which org to reset passwords in
      options:
        - Org 1 (mkt004-1)
        - Org 2 (mkt004-2)
        - Org 3 (mkt004-3)
    validations:
      required: true
  - type: textarea
    id: usernames
    attributes:
      label: Usernames
      description: One full Salesforce username per line (e.g. chris.frias@mkt004-1.com)
      placeholder: "chris.frias@mkt004-1.com\njane.doe@mkt004-1.com"
    validations:
      required: true
